[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drone-analyst"
version = "0.1.0"
description = "Rule-based drone security analyst over simulated telemetry and frame descriptions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
drone-analyst = "drone_analyst.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/drone_analyst"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
